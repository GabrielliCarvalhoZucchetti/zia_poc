
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - AI Governance Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            transition: background-color 300ms ease, color 300ms ease;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        /* Comprehensive Dark Mode overrides using the .dark class */
        html.dark, 
        html.dark body {
            background-color: #030712 !important;
            color: #f8fafc !important;
        }

        html.dark ::-webkit-scrollbar-thumb {
            background: #1e293b;
        }
        html.dark ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Overrides for containers, sidebars, and panels */
        .dark .bg-white {
            background-color: #0d1222 !important;
            color: #f1f5f9 !important;
        }
        .dark .bg-white\/80 {
            background-color: rgba(13, 18, 34, 0.8) !important;
            color: #f1f5f9 !important;
        }
        .dark .bg-white\/60 {
            background-color: rgba(13, 18, 34, 0.6) !important;
        }

        /* Specific sidebar & aside overrides */
        .dark .w-64.bg-white,
        .dark aside.bg-white,
        .dark .w-80.bg-white {
            background-color: #0b0f1a !important;
            border-color: #1e293b !important;
        }

        /* Workspace container layout background overrides */
        .dark div.bg-white {
            background-color: #0d1222 !important;
        }
        .dark div.bg-slate-50,
        .dark div.bg-slate-50\/50,
        .dark .bg-\[\#f8fafc\],
        .dark .bg-\[\#f4f7fe\] {
            background-color: #030712 !important;
        }

        .dark main.bg-white {
            background-color: #030712 !important;
        }

        /* Colors and borders */
        .dark .border-slate-100,
        .dark .border-slate-200,
        .dark .border-slate-300,
        .dark .border-gray-200,
        .dark .border-slate-200\/60,
        .dark .border-transparent {
            border-color: #1e293b !important;
        }

        .dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]),
        .dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) {
            border-color: #1e293b !important;
        }

        /* Typography colors */
        .dark .text-slate-800,
        .dark .text-slate-900,
        .dark .text-slate-700,
        .dark .text-gray-900,
        .dark h1,
        .dark h2,
        .dark h3,
        .dark h4,
        .dark h5,
        .dark h6 {
            color: #f1f5f9 !important;
        }

        .dark .text-slate-600,
        .dark .text-slate-500,
        .dark .text-slate-400,
        .dark .text-gray-600,
        .dark .text-gray-500 {
            color: #94a3b8 !important;
        }

        /* Highlight classes used across the system */
        .dark .bg-sky-50 {
            background-color: rgba(14, 165, 233, 0.1) !important;
            color: #38bdf8 !important;
            border-color: rgba(56, 189, 248, 0.2) !important;
        }
        .dark .bg-sky-50\/50 {
            background-color: rgba(14, 165, 233, 0.05) !important;
            border-color: rgba(56, 189, 248, 0.1) !important;
        }
        .dark .text-sky-700,
        .dark .text-sky-600 {
            color: #38bdf8 !important;
        }

        .dark .bg-indigo-50,
        .dark .bg-indigo-50\/50 {
            background-color: rgba(99, 102, 241, 0.1) !important;
            color: #818cf8 !important;
        }

        .dark .bg-slate-100 {
            background-color: #1e293b !important;
            color: #e2e8f0 !important;
        }

        .dark .bg-slate-50 {
            background-color: #111827 !important;
            color: #cbd5e1 !important;
        }

        /* Hovers and active entries */
        .dark .hover\:bg-slate-50:hover,
        .dark .hover\:bg-sky-50:hover,
        .dark .hover\:bg-indigo-50:hover,
        .dark .group:hover {
            background-color: #1e293b !important;
        }

        /* Form Controls */
        .dark input, 
        .dark select, 
        .dark textarea {
            background-color: #111827 !important;
            color: #f9fafb !important;
            border-color: #1e293b !important;
        }

        .dark input::placeholder {
            color: #4b5563 !important;
        }

        .dark select option {
            background-color: #111827 !important;
            color: #f9fafb !important;
        }

        /* Buttons overrides */
        .dark button.bg-white,
        .dark a.bg-white {
            background-color: #111827 !important;
            border-color: #1e293b !important;
            color: #e2e8f0 !important;
        }
        .dark button.bg-white:hover,
        .dark a.bg-white:hover {
            background-color: #1e293b !important;
        }

        .dark .bg-emerald-50 {
            background-color: rgba(16, 185, 129, 0.1) !important;
            color: #34d399 !important;
            border-color: rgba(52, 211, 153, 0.2) !important;
        }

        .dark .bg-red-50 {
            background-color: rgba(239, 68, 68, 0.1) !important;
            color: #f87171 !important;
            border-color: rgba(248, 113, 113, 0.2) !important;
        }

        /* Table Specific Fixes */
        .dark th {
            background-color: #090e1a !important;
            color: #94a3b8 !important;
            border-color: #1e293b !important;
        }
        .dark td {
            border-color: #1e293b !important;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
